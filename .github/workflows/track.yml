name: Avengers Doomsday Dec 17 Tracker

on:
  schedule:
    # GitHub cron as a fallback — unreliable but free backup.
    # Use an off-beat minute (7,22,37,52) to avoid GitHub's peak-load drops.
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    # External cron services (cron-job.org, EasyCron, etc.) hit this
    # via GitHub API to trigger runs reliably every 15 mins.
    types: [run-tracker]
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from piling up and conflicting on git push
concurrency:
  group: doomsday-tracker
  cancel-in-progress: true

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Always fetch the latest state to avoid stale seen_shows.json
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Pull latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Save updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add seen_shows.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen shows [skip ci]" && git push)